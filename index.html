<script>
const DATA = {"lectures": {"1": "Core principles", "2": "Demand", "3": "Supply", "4": "Equilibrium", "5": "Elasticity", "6": "Government intervention", "7": "Efficiency and surplus", "8": "Trade and comparative advantage"}, "qs": [{"n": 1, "lec": 1, "q": "Why does scarcity force people to make choices?", "ch": ["All goods have a positive money price.", "Resources have competing uses and are limited.", "People always have identical preferences.", "Technology cannot improve."], "a": 1, "ex": "Scarcity means limited resources cannot satisfy every possible use; even time can be scarce when something is free.", "fig": null}, {"n": 2, "lec": 1, "q": "An activity gives you benefits worth $75 and relevant costs of $60. What is its economic surplus?", "ch": ["$75", "$15", "$135", "$60"], "a": 1, "ex": "Economic surplus is benefit minus cost: 75 - 60 = 15.", "fig": null}, {"n": 3, "lec": 1, "q": "You receive a free concert ticket that cannot be sold. Attending prevents you from doing your preferred alternative activity. What is the opportunity cost?", "ch": ["The ticket's printed price only.", "The sum of every activity you could imagine doing.", "Zero because the ticket is free.", "The value of that next-best activity."], "a": 3, "ex": "A free ticket does not make time free. The relevant forgone alternative determines the opportunity cost.", "fig": null}, {"n": 4, "lec": 1, "q": "You can spend an evening working for $80, studying (valued at $65), or watching a movie (valued at $20). Ignoring other costs, what is the opportunity cost of choosing to study?", "ch": ["$80", "$165", "$100", "$20"], "a": 0, "ex": "Working is the best forgone option. Do not sum the values of all rejected alternatives.", "fig": null}, {"n": 5, "lec": 1, "q": "You already waited 25 minutes in a queue. The remaining wait is 10 minutes. Which comparison should determine whether you stay?", "ch": ["Future benefits and remaining costs of staying versus leaving.", "The total time already spent in the queue only.", "Whether leaving would make the past waiting time disappear.", "The cost of waiting 25 minutes again."], "a": 0, "ex": "Past waiting time is sunk. Compare outcomes that can still change from this point onward.", "fig": null}, {"n": 6, "lec": 1, "q": "A treatment is described as having either a 95% survival rate or a 5% death rate. Reacting differently solely to the wording illustrates:", "ch": ["A change in the actual probability.", "A change in opportunity cost.", "A production increase.", "A framing effect."], "a": 3, "ex": "The outcomes are identical; the presentation has changed.", "fig": null}, {"n": 7, "lec": 1, "q": "Your decision to drive changes when parking fees rise. This illustrates interdependence between:", "ch": ["The colour of the demand curve and the axes.", "Markets.", "Absolute and comparative advantage.", "Sunk costs and recoverability."], "a": 1, "ex": "Transportation choices depend on conditions in related markets such as parking.", "fig": null}, {"n": 8, "lec": 1, "q": "An additional tutoring session gives $35 of benefit and costs $28. According to marginal thinking, you should:", "ch": ["Take it only if all previous sessions were free.", "Take the session because it adds $7 of net benefit.", "Reject it because its cost is positive.", "Compare the average benefit of all previous sessions instead."], "a": 1, "ex": "The relevant comparison is the extra benefit with the extra cost of this session.", "fig": null}, {"n": 9, "lec": 1, "q": "A bus trip costs $4 and takes 30 minutes. A taxi costs $16 and takes 10 minutes. You value travel time at $0.50 per minute. Which has the lower combined money and time cost?", "ch": ["They both cost $19.", "The bus, at $19.", "The taxi, at $21, versus a $24 bus cost.", "The taxi, at $16."], "a": 1, "ex": "Bus: 4 + 30(0.50) = 19. Taxi: 16 + 10(0.50) = 21.", "fig": null}, {"n": 10, "lec": 1, "q": "An activity's total benefit is $120 and total cost is $70. A proposed extra unit adds $12 of benefit and $18 of cost. What happens to total net benefit if the extra unit is taken?", "ch": ["It rises from $50 to $62.", "It remains $50.", "It rises from $50 to $68.", "It falls from $50 to $44."], "a": 3, "ex": "The extra unit adds 12 - 18 = -6, reducing net benefit by $6.", "fig": null}, {"n": 11, "lec": 1, "q": "Total benefits from one, two and three hours of practice are $30, $52 and $65. What is the marginal benefit of the third hour?", "ch": ["$65", "$22", "$13", "$35"], "a": 2, "ex": "Marginal benefit is the change in total benefit: 65 - 52 = 13.", "fig": null}, {"n": 12, "lec": 1, "q": "Each extra work shift earns $60. Successive shifts have marginal costs of $15, $35, $55 and $80. How many shifts maximize net benefit?", "ch": ["1", "3", "2", "4"], "a": 1, "ex": "The first three shifts have benefit above cost. The fourth adds 60 - 80 = -20.", "fig": null}, {"n": 13, "lec": 1, "q": "Which belongs in a cost-benefit comparison between cycling and taking the bus?", "ch": ["Differences in travel time, fares and enjoyment.", "Only costs paid in cash.", "Only the option with the highest sticker price.", "The sum of all past bicycle expenses, whether recoverable or not."], "a": 0, "ex": "Relevant costs and benefits include time and nonmonetary effects, not just cash payments.", "fig": null}, {"n": 14, "lec": 1, "q": "You pay the same monthly phone bill whether you attend a lecture or stay home. For this immediate choice, that unchanged bill:", "ch": ["Does not favour either option.", "Makes attending irrational.", "Is the marginal benefit of staying home.", "Must be counted as a new cost of attending only."], "a": 0, "ex": "A cost identical under both alternatives does not change their relative attractiveness.", "fig": null}, {"n": 15, "lec": 1, "q": "At the chosen quantity, an additional unit has marginal benefit equal to marginal cost. That extra unit adds:", "ch": ["An opportunity cost of zero.", "Negative total benefit.", "A net benefit equal to its entire price.", "Zero net benefit."], "a": 3, "ex": "Equality means extra benefit minus extra cost is zero, not that either amount is zero.", "fig": null}, {"n": 16, "lec": 1, "q": "A student earns $20 per hour. A four-hour shift has an opportunity cost of $70 from lost leisure and study, with no other costs. What is the net benefit of the shift?", "ch": ["$20", "$150", "$10", "$70"], "a": 2, "ex": "Earnings are 4 times 20 = 80; net benefit is 80 - 70 = 10.", "fig": null}, {"n": 17, "lec": 1, "q": "A workshop costs $25 and prevents you from accepting a $40 job. Assume that job is your next-best alternative and there are no other relevant costs. What is the economic cost of attending?", "ch": ["$25", "$15", "$65", "$40"], "a": 2, "ex": "Add the direct fee to forgone earnings: 25 + 40 = 65.", "fig": null}, {"n": 18, "lec": 1, "q": "You would pay up to $14 for an item and can buy it for $9. What is your buyer surplus?", "ch": ["$14", "$23", "$9", "$5"], "a": 3, "ex": "Your benefit exceeds the price by 14 - 9 = 5.", "fig": null}, {"n": 19, "lec": 1, "q": "Water can be essential overall yet have a low price per additional cup. Which distinction helps explain this?", "ch": ["Marginal benefit can be low even when total usefulness is high.", "Total usefulness always determines the price of the last unit.", "All essential goods have no opportunity cost.", "Scarcity applies only to luxury goods."], "a": 0, "ex": "The marginal principle evaluates the next unit, rather than the total value of all units.", "fig": null}, {"n": 20, "lec": 1, "q": "A buyer values an item at $18, a seller can provide it at a relevant cost of $10, and the price is $13. Who gains from this trade?", "ch": ["Neither can gain because trade is zero-sum.", "Only the buyer gains, by $8.", "Both: the buyer gains $5 and the seller gains $3.", "Only the seller gains, by $13."], "a": 2, "ex": "Buyer gain is 18 - 13 = 5; seller gain is 13 - 10 = 3. Total gains are $8.", "fig": null}, {"n": 21, "lec": 1, "q": "Your first three study hours were extremely useful. Why does that alone not justify a fourth?", "ch": ["The first three hours determine the fourth hour's cost exactly.", "The fourth hour may have lower extra benefit than extra cost.", "Past benefits must be subtracted twice.", "All fourth hours have zero benefit."], "a": 1, "ex": "A worthwhile total activity can include an unwise extra unit; evaluate the fourth hour separately.", "fig": null}, {"n": 22, "lec": 1, "q": "You paid $50 for a reservation that can still be fully refunded if you cancel today. When deciding whether to attend, the $50 is:", "ch": ["A benefit of attending regardless of alternatives.", "Recoverable and therefore relevant to the current choice.", "A sunk cost that must be ignored.", "Always irrelevant because it was paid earlier."], "a": 1, "ex": "A past payment is not sunk if the current decision can recover it.", "fig": null}, {"n": 23, "lec": 1, "q": "You choose a busier route because it currently saves time, but many other drivers make the same choice and congestion rises. This illustrates:", "ch": ["Interdependence between people's choices.", "A change in the definition of scarcity.", "A fixed production frontier.", "The absence of opportunity cost."], "a": 0, "ex": "Other people's choices alter the costs and benefits of your own choice.", "fig": null}, {"n": 24, "lec": 1, "q": "A firm delays buying equipment because it expects a better model next month. Which principle is most directly illustrated?", "ch": ["The absence of trade-offs.", "Ignoring all future outcomes.", "The rule that sunk costs should dominate.", "Interdependence over time."], "a": 3, "ex": "Today's best choice depends on expected future options and outcomes.", "fig": null}, {"n": 25, "lec": 1, "q": "Using Figure 1, how should point A be classified?", "ch": ["Proof that resources are unlimited.", "Attainable but below the frontier.", "Unattainable with current resources.", "Attainable and productively efficient."], "a": 3, "ex": "A lies on the PPF, so it is feasible and uses productive capacity efficiently.", "fig": 1}, {"n": 26, "lec": 1, "q": "Using Figure 1, what does point B indicate?", "ch": ["Both outputs exceed their maximum possible levels.", "Production is beyond current capacity.", "Resources are underused or used inefficiently.", "There is no opportunity to increase either output."], "a": 2, "ex": "B is inside the frontier, leaving room to expand production with existing resources.", "fig": 1}, {"n": 27, "lec": 1, "q": "Using Figure 1, point C is:", "ch": ["Efficient because it has more of both goods than B.", "Unattainable with current resources and technology.", "The only feasible production combination.", "Inefficient but currently feasible."], "a": 1, "ex": "C lies outside the current PPF. Desirability does not imply feasibility.", "fig": 1}, {"n": 28, "lec": 1, "q": "Using Figure 1, what is the opportunity cost of one additional unit of X along the frontier?", "ch": ["0.5 unit of Y.", "2 units of Y.", "30 units of Y.", "60 units of Y."], "a": 1, "ex": "The frontier trades 60 Y for 30 X, so each X costs 60/30 = 2 Y.", "fig": 1}, {"n": 29, "lec": 1, "q": "Using Figure 1, moving along the frontier from 10 units of X to 15 units of X requires giving up:", "ch": ["15 units of Y.", "10 units of Y.", "30 units of Y.", "5 units of Y."], "a": 1, "ex": "Five extra X cost 2 Y each, so 10 Y must be forgone.", "fig": 1}, {"n": 30, "lec": 1, "q": "Suppose the maximum outputs in Figure 1 both double while the PPF remains straight. What happens?", "ch": ["The PPF stays in place and the opportunity cost doubles.", "The PPF expands outward and the opportunity cost of X stays at 2 Y.", "The PPF expands outward and opportunity cost falls to zero.", "The PPF shifts inward and opportunity cost halves."], "a": 1, "ex": "Doubling both intercepts raises capacity but leaves their ratio, and therefore opportunity cost, unchanged.", "fig": 1}, {"n": 31, "lec": 2, "q": "Holding other influences constant, a fall in a good's own price normally causes:", "ch": ["A decrease in demand.", "A rightward shift of demand.", "An increase in quantity demanded.", "A leftward shift of supply."], "a": 2, "ex": "The law of demand describes a movement along a given demand curve.", "fig": null}, {"n": 32, "lec": 2, "q": "At a particular quantity, the height of a demand curve represents:", "ch": ["The seller's fixed cost.", "The total spending of all buyers.", "The marginal willingness to pay for that unit.", "The average cost of production."], "a": 2, "ex": "Demand is the marginal-benefit curve: willingness to pay for the additional unit.", "fig": null}, {"n": 33, "lec": 2, "q": "Successive sandwiches provide benefits of $11, $8, $5 and $2. At a price of $6, how many should the buyer purchase?", "ch": ["2", "3", "4", "1"], "a": 0, "ex": "Only the first two units have marginal benefits at least as large as the $6 price.", "fig": null}, {"n": 34, "lec": 2, "q": "A buyer purchases two units with marginal benefits of $12 and $9 at a price of $7 each. What is the buyer's total surplus?", "ch": ["$14", "$5", "$21", "$7"], "a": 3, "ex": "Add the gains on purchased units: (12 - 7) + (9 - 7) = 7.", "fig": null}, {"n": 35, "lec": 2, "q": "At a $5 price, three consumers demand 2, 4 and 1 units. What is market quantity demanded at $5?", "ch": ["3 units.", "4 units.", "7 units.", "$15."], "a": 2, "ex": "Market demand horizontally adds quantities at the same price: 2 + 4 + 1 = 7.", "fig": null}, {"n": 36, "lec": 2, "q": "The price of strawberries rises and consumers buy fewer strawberries. This is:", "ch": ["Proof that strawberries are inferior.", "A leftward shift of the demand curve.", "A rightward shift of supply caused by demand.", "A movement up along the demand curve."], "a": 3, "ex": "An own-price change alters quantity demanded, not demand itself.", "fig": null}, {"n": 37, "lec": 2, "q": "Income rises and demand for a normal good responds as expected. Its demand curve:", "ch": ["Becomes the supply curve.", "Shifts right.", "Shifts left.", "Does not move because income can never affect demand."], "a": 1, "ex": "Demand for a normal good rises when income rises, holding price and other factors fixed.", "fig": null}, {"n": 38, "lec": 2, "q": "Demand for an inferior good falls when:", "ch": ["Its own price falls, with all else fixed.", "Consumer income rises.", "The number of its buyers rises.", "Income falls, with all else fixed."], "a": 1, "ex": "Inferior means quantity desired at each price declines as income rises.", "fig": null}, {"n": 39, "lec": 2, "q": "Tea and coffee are substitutes. If tea becomes more expensive, coffee demand:", "ch": ["Increases.", "Moves along coffee's original curve solely because tea's price changed.", "Decreases.", "Must remain unchanged."], "a": 0, "ex": "Buyers switch toward coffee; another good's price shifts coffee demand.", "fig": null}, {"n": 40, "lec": 2, "q": "Game consoles and compatible games are complements. If console prices rise, demand for compatible games tends to:", "ch": ["Become supply.", "Shift right.", "Shift left.", "Move right solely along the original game demand curve."], "a": 2, "ex": "A higher cost of the complementary product reduces demand for goods used with it.", "fig": null}, {"n": 41, "lec": 2, "q": "Buyers expect the price of a storable good to rise next month. All else equal, current demand may:", "ch": ["Increase because buyers bring purchases forward.", "Increase only if current price has already fallen.", "Decrease because all current purchases become sunk.", "Stay fixed by definition."], "a": 0, "ex": "Expected future prices can change today's willingness to buy.", "fig": null}, {"n": 42, "lec": 2, "q": "A messaging app becomes more useful as more friends join it. This is an example of:", "ch": ["An own-price movement only.", "A congestion effect that necessarily lowers demand.", "An increase in the app's marginal production cost.", "A network effect that can increase demand."], "a": 3, "ex": "Additional users raise the value of the service to other users.", "fig": null}, {"n": 43, "lec": 2, "q": "A beach becomes less attractive because it is overcrowded. The effect on an individual's demand for visits is best described as:", "ch": ["An increase in quantity demanded caused by a lower entry price.", "A change in the beach's physical supply only.", "A network effect that always increases demand.", "A congestion effect that can reduce demand."], "a": 3, "ex": "More users can lower usefulness when crowding imposes costs.", "fig": null}, {"n": 44, "lec": 2, "q": "A town gains many new residents who want groceries. Holding other factors fixed, market grocery demand:", "ch": ["Shifts left.", "Shifts right.", "Must stay fixed because each person's preferences are unchanged.", "Moves left along the original curve because population is a price."], "a": 1, "ex": "More individual demands are added to the market at each price.", "fig": null}, {"n": 45, "lec": 2, "q": "A popular review makes a brand more desirable without changing its price. This causes:", "ch": ["An automatic reduction in marginal benefit.", "Only movement along the same demand curve.", "A rightward demand shift.", "A leftward demand shift."], "a": 2, "ex": "Preferences changed, so buyers want more at each given price.", "fig": null}, {"n": 46, "lec": 2, "q": "Restaurant dinners are a normal good. During a fall in consumer incomes, their demand tends to:", "ch": ["Move right along the same curve because dinner prices must rise.", "Become perfectly elastic automatically.", "Shift left.", "Shift right."], "a": 2, "ex": "Normal-good demand falls as income falls, other things equal.", "fig": null}, {"n": 47, "lec": 2, "q": "Which pair of events both reduces demand for a normal good X?", "ch": ["Lower income and a lower price of a substitute.", "A lower price of a complement and higher income.", "Higher income and a higher price of a substitute.", "More buyers and greater popularity."], "a": 0, "ex": "Both lower income and a cheaper substitute reduce demand for X.", "fig": null}, {"n": 48, "lec": 2, "q": "Coffee demand increases because tea becomes dearer, but decreases because coffee becomes less fashionable. Without shift sizes, the net change in coffee demand is:", "ch": ["Definitely an increase.", "Definitely a decrease.", "Necessarily zero.", "Ambiguous."], "a": 3, "ex": "The two determinants push demand in opposite directions; equal size is not given.", "fig": null}, {"n": 49, "lec": 2, "q": "A rise in the number of retirees increases demand for cruises at every price. This is best called:", "ch": ["A movement caused by a change in cruise price alone.", "An increase in market demand.", "A fall in the number of buyers.", "A decrease in demand."], "a": 1, "ex": "A change in the type and number of potential buyers shifts market demand.", "fig": null}, {"n": 50, "lec": 2, "q": "A shop cuts the price of its own notebooks. Assuming no other changes, which wording is correct?", "ch": ["Supply of notebooks must shift left.", "Quantity demanded of its notebooks rises.", "The notebooks become inferior goods.", "Demand for its notebooks shifts right."], "a": 1, "ex": "A good's own price causes movement along demand; it does not establish an income classification.", "fig": null}, {"n": 51, "lec": 2, "q": "An inferior good becomes more expensive while income stays unchanged. Under the usual downward-sloping demand assumption, quantity demanded:", "ch": ["Must remain unchanged.", "Rises because all inferior goods violate the law of demand.", "Falls along the demand curve.", "Falls because income has increased."], "a": 2, "ex": "Inferior describes an income response, not an exception to the usual own-price relationship assumed here.", "fig": null}, {"n": 52, "lec": 2, "q": "What does the phrase 'holding all else constant' mean when interpreting a demand curve?", "ch": ["Income must be zero.", "No consumer can change quantity.", "Supply cannot exist.", "Other demand determinants are kept fixed while own price varies."], "a": 3, "ex": "The demand curve isolates the own-price relationship from other influences.", "fig": null}, {"n": 53, "lec": 2, "q": "At a $6 price, Ana's unit benefits are $9, $7, $4; Ben's are $8, $5, $2; Cara's are $10, $8, $7. How many units does this market demand?", "ch": ["5", "3", "6", "9"], "a": 2, "ex": "Ana buys 2, Ben 1 and Cara 3. Total demand is 6 units.", "fig": null}, {"n": 54, "lec": 2, "q": "Why might a firm price printers cheaply while earning substantial money from ink?", "ch": ["Cheaper printers can increase demand for complementary ink.", "Ink demand cannot depend on printer ownership.", "A printer price cut automatically reduces printer sales.", "Printers and ink must be substitutes."], "a": 0, "ex": "A lower price of one complement can increase demand for the other.", "fig": null}, {"n": 55, "lec": 2, "q": "In Figure 2, moving from D0 to D1 represents:", "ch": ["An increase in demand.", "A change in supply only.", "An increase in quantity demanded caused only by lower own price.", "A decrease in demand."], "a": 0, "ex": "D1 lies to the right of D0: more is demanded at every price.", "fig": 2}, {"n": 56, "lec": 2, "q": "Using D0 in Figure 2, how many units are demanded at a price of $8?", "ch": ["4", "12", "8", "6"], "a": 0, "ex": "On D0, P = 12 - Q. Setting P to 8 gives Q = 4.", "fig": 2}, {"n": 57, "lec": 2, "q": "Using Figure 2, how much does the demand shift increase quantity demanded at a fixed price of $8?", "ch": ["2 units.", "4 units.", "8 units.", "12 units."], "a": 1, "ex": "D0 gives Q = 4 and D1 gives Q = 8 at P = 8; the increase is 4.", "fig": 2}, {"n": 58, "lec": 2, "q": "In Figure 2, which event could shift demand from D0 to D1 if the good is normal?", "ch": ["An increase in buyer income.", "A rise in the price of a complement.", "A fall in the number of buyers.", "A fall in the good's own price alone."], "a": 0, "ex": "Higher income raises normal-good demand; an own-price change moves along a curve instead.", "fig": 2}, {"n": 59, "lec": 2, "q": "Using D1 in Figure 2, what is the marginal willingness to pay for the sixth unit?", "ch": ["$16", "$10", "$12", "$6"], "a": 1, "ex": "D1 has P = 16 - Q, so its height at Q = 6 is $10.", "fig": 2}, {"n": 60, "lec": 2, "q": "On D0 in Figure 2, price falls from $8 to $6 with no other change. What happens?", "ch": ["Demand shifts from D0 to D1.", "Demand shifts left by 2 units.", "Quantity demanded rises from 4 to 6 along D0.", "Quantity demanded falls from 6 to 4."], "a": 2, "ex": "Both points lie on D0. The lower own price increases quantity demanded without shifting demand.", "fig": 2}, {"n": 61, "lec": 3, "q": "In a competitive market, the height of a firm's supply curve represents the:", "ch": ["Marginal cost of supplying another unit.", "Firm's total profit.", "Average willingness to pay of buyers.", "Total cost of all units produced."], "a": 0, "ex": "The supply curve identifies the marginal cost at each quantity, within the relevant range of production.", "fig": null}, {"n": 62, "lec": 3, "q": "A seller's minimum acceptable price for a used bicycle is $140. A buyer offers $110. Assuming no other benefits, the seller should:", "ch": ["Reject only if the bicycle originally cost more than $140.", "Reject the offer because it is below the seller's opportunity cost.", "Accept because any payment creates a gain.", "Accept because the original purchase price is sunk."], "a": 1, "ex": "The reservation price reflects the value of keeping the bicycle or its next-best use. An offer below it does not make the seller better off.", "fig": null}, {"n": 63, "lec": 3, "q": "The marginal costs of four units are $3, $5, $8, and $12. At a market price of $9, how many units maximize surplus from production?", "ch": ["3", "2", "4", "1"], "a": 0, "ex": "Produce the first three units because their marginal costs are below $9; the fourth costs more than it earns.", "fig": null}, {"n": 64, "lec": 3, "q": "A firm produces three units with marginal costs of $2, $4, and $7 and sells each for $8. What is producer surplus from these units?", "ch": ["$24", "$11", "$13", "$8"], "a": 1, "ex": "Revenue is 3 x 8 = 24 and the sum of marginal costs is 13. Producer surplus is 24 - 13 = 11, before subtracting fixed costs.", "fig": null}, {"n": 65, "lec": 3, "q": "A firm pays $900 monthly rent regardless of current output. For a decision to produce one more unit this month, this unchanged rent is:", "ch": ["Always equal to the product's market price.", "Not part of the marginal cost of that extra unit.", "The entire marginal cost of that unit.", "An additional $900 cost each time a unit is made."], "a": 1, "ex": "A cost that does not change with this output decision contributes nothing to its marginal cost.", "fig": null}, {"n": 66, "lec": 3, "q": "What is the difference between a fixed cost and a sunk cost?", "ch": ["Fixed means unchanged with output over a relevant range; sunk means unrecoverable.", "Sunk costs rise with each extra unit produced.", "Fixed means paid in cash; sunk means paid in time.", "Every fixed cost is necessarily unrecoverable."], "a": 0, "ex": "These labels answer different questions. A fixed cost can sometimes be avoided or recovered, while a sunk cost cannot be recovered.", "fig": null}, {"n": 67, "lec": 3, "q": "With the amount of equipment fixed, adding more workers eventually adds less output per extra worker. This illustrates:", "ch": ["Increasing demand.", "A reduction in the market wage.", "A fall in total output after every additional worker.", "Diminishing marginal product."], "a": 3, "ex": "Diminishing marginal product means extra output gets smaller; total output can still rise.", "fig": null}, {"n": 68, "lec": 3, "q": "A worker costs $120 per day and adds 20 units per day. What is the extra labour cost per unit of this additional output?", "ch": ["$120", "$2,400", "$6", "$0.17"], "a": 2, "ex": "Divide the additional cost by additional output: 120 / 20 = 6 dollars per unit.", "fig": null}, {"n": 69, "lec": 3, "q": "Five successive workers add 20, 16, 12, 8, and 4 units per day. Price is $4 per unit and each worker costs $30 per day. How many workers should the firm hire?", "ch": ["2", "5", "4", "3"], "a": 2, "ex": "The workers add revenue of $80, $64, $48, $32, and $16. Hire the first four; the fifth adds less revenue than the $30 wage.", "fig": null}, {"n": 70, "lec": 3, "q": "At one price, firm A supplies 5 units, firm B supplies 7, and firm C supplies 0. Market quantity supplied is:", "ch": ["7 units.", "12 units.", "35 units.", "5 units."], "a": 1, "ex": "Market supply adds the quantities supplied by all sellers at the same price.", "fig": null}, {"n": 71, "lec": 3, "q": "The price of bread rises while all other supply influences stay fixed. This causes:", "ch": ["A rightward shift of bread supply.", "An increase in quantity supplied along the bread supply curve.", "No response from any competitive seller.", "A leftward shift of bread supply."], "a": 1, "ex": "A change in the good's own price causes movement along its supply curve.", "fig": null}, {"n": 72, "lec": 3, "q": "The price of flour used to make bread rises. What happens to bread supply, other things equal?", "ch": ["Only a movement up the existing supply curve occurs.", "Bread demand must shift left by the same amount.", "It shifts left because marginal production costs rise.", "It shifts right because bread becomes more expensive to make."], "a": 2, "ex": "Higher input costs make supplying any given quantity more costly, shifting supply up or left.", "fig": null}, {"n": 73, "lec": 3, "q": "An improved machine reduces the labour needed to make each unit. Other things equal, supply:", "ch": ["Shifts left.", "Shifts right.", "Stays fixed because technology affects only demand.", "Becomes perfectly inelastic in every case."], "a": 1, "ex": "A cost-saving improvement makes more production worthwhile at each price.", "fig": null}, {"n": 74, "lec": 3, "q": "A farmer can use the same land for wheat or corn. The price of corn rises. With other factors fixed, the farmer's wheat supply tends to:", "ch": ["Increase because wheat and corn are substitutes for consumers.", "Decrease because producing wheat now sacrifices more corn revenue.", "Increase because all crops become more profitable.", "Stay unchanged because wheat's own price did not change."], "a": 1, "ex": "The relevant connection is competing uses of resources in production. Higher corn prices raise the opportunity cost of growing wheat.", "fig": null}, {"n": 75, "lec": 3, "q": "Beef and hides are joint products. A higher beef price encourages more cattle production. Other things equal, hide supply will tend to:", "ch": ["Increase.", "Fall to zero.", "Decrease.", "Become demand."], "a": 0, "ex": "Producing more of one joint product also produces more of the other, increasing its supply.", "fig": null}, {"n": 76, "lec": 3, "q": "Sellers can store a good cheaply and expect its price to be much higher next month. Other things equal, supply offered today tends to:", "ch": ["Increase because future prices never affect current decisions.", "Increase because today's price has already risen by assumption.", "Decrease as some sales are postponed.", "Stay unchanged in every case."], "a": 2, "ex": "When sellers can wait, a higher expected future selling price can make current selling less attractive.", "fig": null}, {"n": 77, "lec": 3, "q": "Several new firms enter a market without changing existing firms' costs. Market supply:", "ch": ["Must become vertical.", "Shifts right.", "Shifts left.", "Moves upward along a fixed curve only."], "a": 1, "ex": "More sellers add quantities at each price, shifting market supply right.", "fig": null}, {"n": 78, "lec": 3, "q": "Which combination tends to shift supply left?", "ch": ["Higher input costs and fewer sellers.", "Lower input costs and better technology.", "More sellers and lower input costs.", "Better production technology and more sellers."], "a": 0, "ex": "Both higher costs and a reduction in the number of sellers reduce quantity supplied at a given price.", "fig": null}, {"n": 79, "lec": 3, "q": "Input prices rise while a new technology reduces production costs. What can be concluded about the net supply shift without knowing their sizes?", "ch": ["Supply definitely shifts left.", "Demand definitely shifts right.", "Its direction is uncertain.", "Supply definitely shifts right."], "a": 2, "ex": "The two effects push supply in opposite directions, so their relative magnitudes matter.", "fig": null}, {"n": 80, "lec": 3, "q": "Why is an individual firm described as a price taker in a perfectly competitive market?", "ch": ["It controls total market supply.", "Its marginal cost must be zero.", "It is too small relative to the market to control the market price.", "It may choose any price without affecting its sales."], "a": 2, "ex": "Many sellers offering comparable products leave an individual small firm with little control over market price.", "fig": null}, {"n": 81, "lec": 3, "q": "A firm's hourly output with 0, 1, 2, 3, and 4 workers is 0, 10, 18, 24, and 28 units. If price is $5 and the hourly wage is $25, how many workers should it employ?", "ch": ["4", "3", "2", "1"], "a": 1, "ex": "Marginal products are 10, 8, 6, and 4. Extra revenues are $50, $40, $30, and $20 per hour; only the first three exceed the $25 wage.", "fig": null}, {"n": 82, "lec": 3, "q": "A worker adds 3 units per hour during a 6-hour shift. Each unit sells for $5 and the worker earns $12 per hour. What is the net benefit of hiring this worker for the shift?", "ch": ["$78", "$18", "$3", "$90"], "a": 1, "ex": "Shift revenue is 3 x 6 x 5 = 90 and the wage bill is 12 x 6 = 72. The net gain is 18; use matching time units.", "fig": null}, {"n": 83, "lec": 3, "q": "A firm receives $15 for an extra unit whose marginal cost is $18. Producing that unit changes its economic surplus by:", "ch": ["Plus $15.", "Minus $3.", "Minus $18.", "Plus $3."], "a": 1, "ex": "The extra revenue minus extra cost is 15 - 18 = -3. Total revenue rising does not guarantee a beneficial production decision.", "fig": null}, {"n": 84, "lec": 3, "q": "A seller would accept $50 for an item and receives $65. What is this seller's producer surplus?", "ch": ["$50", "$15", "$115", "$65"], "a": 1, "ex": "Producer surplus is price received minus the seller's opportunity cost: 65 - 50 = 15.", "fig": null}, {"n": 85, "lec": 3, "q": "In Figure 3, the shift from S0 to S1 is:", "ch": ["An increase in quantity supplied caused only by a higher own price.", "A decrease in supply.", "An increase in supply.", "A change in demand."], "a": 1, "ex": "S1 is above and to the left of S0, so suppliers offer less at each price.", "fig": 3}, {"n": 86, "lec": 3, "q": "Using S0 in Figure 3, how much is supplied at a price of $10?", "ch": ["6 units.", "10 units.", "12 units.", "8 units."], "a": 3, "ex": "S0 is P = 2 + Q. At P = 10, Q = 8.", "fig": 3}, {"n": 87, "lec": 3, "q": "Using S1 in Figure 3, what is the marginal cost of the sixth unit?", "ch": ["$10", "$12", "$6", "$8"], "a": 0, "ex": "S1 is P = 4 + Q. At Q = 6 its height is $10.", "fig": 3}, {"n": 88, "lec": 3, "q": "In Figure 3, which event could explain the shift from S0 to S1?", "ch": ["An improvement in cost-saving technology.", "Entry of additional sellers.", "A rise in this good's own price alone.", "A rise in the price of a production input."], "a": 3, "ex": "Higher input costs shift the supply curve up or left; an own-price change moves along it.", "fig": 3}, {"n": 89, "lec": 3, "q": "On S0 in Figure 3, price rises from $6 to $10. What happens to quantity supplied?", "ch": ["It rises from 2 to 6 units.", "It falls from 8 to 4 units.", "It rises from 4 to 8 units.", "It remains at 6 units."], "a": 2, "ex": "Substitute into Q = P - 2: the quantities are 4 and 8. This is movement along S0.", "fig": 3}, {"n": 90, "lec": 3, "q": "At a fixed price of $10 in Figure 3, shifting from S0 to S1 changes quantity supplied by:", "ch": ["An increase of 2 units.", "A decrease of 4 units.", "A decrease of 2 units.", "An increase of 4 units."], "a": 2, "ex": "Supply falls from Q = 8 on S0 to Q = 6 on S1 at the same price.", "fig": 3}, {"n": 91, "lec": 4, "q": "A competitive market is in equilibrium when:", "ch": ["Quantity demanded equals quantity supplied at the prevailing price.", "Every buyer can obtain any quantity free.", "All sellers earn zero revenue.", "Demand and supply curves have identical slopes."], "a": 0, "ex": "Equilibrium is the price-quantity combination where buyers' and sellers' intended quantities agree.", "fig": null}, {"n": 92, "lec": 4, "q": "At a price of $4, buyers want 90 units and sellers offer 50. The market has:", "ch": ["A surplus of 50 units.", "A shortage of 140 units.", "A surplus of 40 units.", "A shortage of 40 units."], "a": 3, "ex": "Shortage is quantity demanded minus quantity supplied: 90 - 50 = 40.", "fig": null}, {"n": 93, "lec": 4, "q": "At a price of $12, buyers want 40 units and sellers offer 100. The market has:", "ch": ["A shortage of 40 units.", "A surplus of 60 units.", "A shortage of 60 units.", "A surplus of 140 units."], "a": 1, "ex": "Surplus is quantity supplied minus quantity demanded: 100 - 40 = 60.", "fig": null}, {"n": 94, "lec": 4, "q": "In an otherwise competitive market with flexible prices, a shortage creates pressure for price to:", "ch": ["Rise, reducing quantity demanded and increasing quantity supplied.", "Fall, increasing quantity demanded and decreasing quantity supplied.", "Stay below equilibrium permanently.", "Rise, shifting both demand and supply right automatically."], "a": 0, "ex": "The price adjustment moves buyers and sellers along their existing curves until the shortage closes.", "fig": null}, {"n": 95, "lec": 4, "q": "Unsold inventories build up because price is above equilibrium. A typical competitive-market adjustment is:", "ch": ["Sellers raise price to remove the surplus.", "Buyers reduce demand solely because price falls.", "Sellers reduce price, increasing quantity demanded and reducing quantity supplied.", "Supply must shift right until inventories disappear."], "a": 2, "ex": "A lower price makes buyers want more and sellers offer less, reducing the excess supply.", "fig": null}, {"n": 96, "lec": 4, "q": "At prices $10, $20, and $30, quantities demanded are 90, 60, and 30, while quantities supplied are 20, 60, and 100. Equilibrium is:", "ch": ["Price $20 and quantity 120.", "Price $10 and quantity 20.", "Price $30 and quantity 30.", "Price $20 and quantity 60."], "a": 3, "ex": "At $20, quantity demanded equals quantity supplied at 60. Do not add the two sides together.", "fig": null}, {"n": 97, "lec": 4, "q": "More consumers develop a taste for a product. With an upward-sloping unchanged supply curve, equilibrium:", "ch": ["Price and quantity both fall.", "Price falls and quantity rises.", "Price and quantity both rise.", "Price rises and quantity falls."], "a": 2, "ex": "A rightward demand shift creates a higher-price, higher-quantity intersection on the existing supply curve.", "fig": null}, {"n": 98, "lec": 4, "q": "Consumer income falls for a normal good. With supply unchanged, equilibrium:", "ch": ["Price falls and quantity rises.", "Price rises and quantity falls.", "Price and quantity both fall.", "Price and quantity both rise."], "a": 2, "ex": "Lower income reduces demand for a normal good, moving the intersection down and left.", "fig": null}, {"n": 99, "lec": 4, "q": "Production technology improves and lowers costs. With demand unchanged, equilibrium:", "ch": ["Price rises and quantity falls.", "Price and quantity both rise.", "Price and quantity both fall.", "Price falls and quantity rises."], "a": 3, "ex": "Supply shifts right. The new intersection lies lower and farther right on demand.", "fig": null}, {"n": 100, "lec": 4, "q": "An important input becomes more expensive. With demand unchanged, equilibrium:", "ch": ["Price and quantity both rise.", "Price falls and quantity rises.", "Price and quantity both fall.", "Price rises and quantity falls."], "a": 3, "ex": "Supply shifts left, creating a higher price and lower quantity.", "fig": null}, {"n": 101, "lec": 4, "q": "Demand and supply both increase. Without knowing the sizes of the shifts, which outcome is certain?", "ch": ["Equilibrium price falls.", "Equilibrium quantity rises.", "Equilibrium quantity falls.", "Equilibrium price rises."], "a": 1, "ex": "Both shifts increase quantity, but demand pushes price up while supply pushes it down.", "fig": null}, {"n": 102, "lec": 4, "q": "Demand and supply both decrease. Without knowing the sizes of the shifts, which outcome is certain?", "ch": ["Equilibrium price rises.", "Equilibrium price falls.", "Equilibrium quantity falls.", "Equilibrium quantity rises."], "a": 2, "ex": "Both shifts reduce quantity. Their effects on price oppose each other.", "fig": null}, {"n": 103, "lec": 4, "q": "Demand increases and supply decreases. Which outcome is certain under the usual curve slopes?", "ch": ["Equilibrium quantity rises.", "Equilibrium quantity falls.", "Equilibrium price rises.", "Equilibrium price falls."], "a": 2, "ex": "Both shifts raise price, while their quantity effects oppose each other.", "fig": null}, {"n": 104, "lec": 4, "q": "Demand decreases and supply increases. Which outcome is certain under the usual curve slopes?", "ch": ["Equilibrium price falls.", "Equilibrium quantity falls.", "Equilibrium quantity rises.", "Equilibrium price rises."], "a": 0, "ex": "Both changes lower price. Quantity depends on which shift is stronger.", "fig": null}, {"n": 105, "lec": 4, "q": "Equilibrium price and quantity both rise. Assuming exactly one curve shifted, the change is consistent with:", "ch": ["A decrease in demand.", "An increase in demand.", "An increase in supply.", "A decrease in supply."], "a": 1, "ex": "Only a rightward demand shift raises both equilibrium price and quantity in the standard model.", "fig": null}, {"n": 106, "lec": 4, "q": "Equilibrium price rises while quantity falls. Assuming exactly one curve shifted, the change is consistent with:", "ch": ["An increase in demand.", "A decrease in demand.", "An increase in supply.", "A decrease in supply."], "a": 3, "ex": "A leftward supply shift raises price and reduces quantity.", "fig": null}, {"n": 107, "lec": 4, "q": "Coffee and tea are substitutes. The price of coffee rises. With tea supply unchanged, what happens in the tea market?", "ch": ["Tea quantity demanded falls only along its existing demand curve.", "Tea demand falls, lowering tea's price and quantity.", "Tea supply falls because coffee is a substitute.", "Tea demand rises, raising tea's equilibrium price and quantity."], "a": 3, "ex": "The price of another substitute shifts tea demand. The later change in tea's own price is movement along tea supply.", "fig": null}, {"n": 108, "lec": 4, "q": "In a labour market, who supplies labour and who demands it?", "ch": ["Consumers supply labour only when wages fall.", "Government always supplies all labour.", "Workers supply labour; employers demand it.", "Employers supply labour; workers demand it."], "a": 2, "ex": "Workers sell labour services, while employers buy them. The wage is the price in this market.", "fig": null}, {"n": 109, "lec": 4, "q": "With labour supply unchanged, firms want to hire more workers at every wage. The standard model predicts:", "ch": ["Higher wages and lower employment.", "Higher equilibrium wages and employment.", "Lower wages and higher employment.", "Lower wages and employment."], "a": 1, "ex": "Labour demand shifts right, raising both the wage and equilibrium quantity of labour.", "fig": null}, {"n": 110, "lec": 4, "q": "A rise in market price encourages buyers to economize and sellers to produce more. This illustrates price's role as:", "ch": ["A guarantee that every buyer gets the same income.", "An incentive coordinating decisions on both sides of a market.", "A force that always shifts demand and supply right.", "A way to eliminate scarcity completely."], "a": 1, "ex": "Price communicates relative scarcity and changes the rewards and costs of buyers' and sellers' choices.", "fig": null}, {"n": 111, "lec": 4, "q": "A storm destroys orange crops. In the orange market, the resulting higher price causes:", "ch": ["A leftward demand shift caused by the higher orange price itself.", "An increase in demand because oranges are scarce.", "An immediate rightward supply shift that cancels the storm.", "A movement to lower quantity demanded along the existing demand curve."], "a": 3, "ex": "The storm shifts supply left. The increase in the good's own price then causes movement along demand.", "fig": null}, {"n": 112, "lec": 4, "q": "Suppose Qd = 100 - 2P and Qs = 20 + 2P. What is equilibrium price?", "ch": ["$30", "$10", "$40", "$20"], "a": 3, "ex": "Set 100 - 2P = 20 + 2P. Then 80 = 4P, so P = 20 and Q = 60.", "fig": null}, {"n": 113, "lec": 4, "q": "At a fixed price buyers want 80 units, but sellers offer only 50. Assuming willing traders can be matched, how many units can be traded?", "ch": ["130", "30", "50", "80"], "a": 2, "ex": "The short side limits transactions. A shortage of 30 does not mean that 30 units are traded.", "fig": null}, {"n": 114, "lec": 4, "q": "Demand and supply both shift right, and equilibrium price is unchanged. What happened to equilibrium quantity?", "ch": ["It increased.", "It stayed unchanged.", "It became zero.", "It decreased."], "a": 0, "ex": "At the unchanged price, both shifted curves imply a larger common quantity.", "fig": null}, {"n": 115, "lec": 4, "q": "What is the equilibrium in Figure 4?", "ch": ["Price $5 and quantity 3.", "Price $11 and quantity 9.", "Price $8 and quantity 6.", "Price $6 and quantity 8."], "a": 2, "ex": "Solve or read the intersection of P = 14 - Q and P = 2 + Q: Q = 6, P = 8.", "fig": 4}, {"n": 116, "lec": 4, "q": "In Figure 4, at a price of $5 the market has:", "ch": ["A shortage of 6 units.", "A surplus of 6 units.", "A shortage of 3 units.", "A surplus of 9 units."], "a": 0, "ex": "At P = 5, Qd = 9 and Qs = 3. The shortage is 9 - 3 = 6.", "fig": 4}, {"n": 117, "lec": 4, "q": "In Figure 4, at a price of $11 the market has:", "ch": ["A shortage of 6 units.", "A shortage of 9 units.", "A surplus of 3 units.", "A surplus of 6 units."], "a": 3, "ex": "At P = 11, Qs = 9 and Qd = 3. Excess supply equals 6.", "fig": 4}, {"n": 118, "lec": 4, "q": "If price is held at $5 in Figure 4 and willing traders can be matched, how many units are traded?", "ch": ["6", "12", "9", "3"], "a": 3, "ex": "Quantity supplied is only 3, so it limits sales even though buyers want 9.", "fig": 4}, {"n": 119, "lec": 4, "q": "Starting at the equilibrium in Figure 4, demand increases while supply stays fixed. Where is the new equilibrium relative to the old one?", "ch": ["Above and to the left, along the existing demand curve.", "Above and to the right, along the existing supply curve.", "Below and to the left, along the existing supply curve.", "Below and to the right, along the existing demand curve."], "a": 1, "ex": "Higher demand raises equilibrium price and quantity. Supply itself does not shift.", "fig": 4}, {"n": 120, "lec": 4, "q": "Starting from a price of $11 in Figure 4, allowing price to fall toward equilibrium causes:", "ch": ["Both quantities to fall.", "Demand to shift right and supply to shift left automatically.", "Quantity demanded to rise and quantity supplied to fall.", "Quantity demanded to fall and quantity supplied to rise."], "a": 2, "ex": "As price falls from 11 to 8, Qd rises from 3 to 6 and Qs falls from 9 to 6, removing the surplus.", "fig": 4}, {"n": 121, "lec": 5, "q": "Price elasticity of demand measures:", "ch": ["Only the slope of demand, regardless of units or location.", "How responsive quantity demanded is to a price change in percentage terms.", "How much total cost rises when one more unit is produced.", "The dollar difference between price and marginal cost."], "a": 1, "ex": "Elasticity compares percentage changes, making it a unit-free measure of responsiveness.", "fig": null}, {"n": 122, "lec": 5, "q": "Price rises by 10% and quantity demanded falls by 25%. The magnitude of price elasticity of demand is:", "ch": ["0.4, so demand is inelastic.", "15, so demand is elastic.", "2.5, so demand is inelastic.", "2.5, so demand is elastic."], "a": 3, "ex": "Divide the magnitude of the quantity percentage change by the price percentage change: 25 / 10 = 2.5.", "fig": null}, {"n": 123, "lec": 5, "q": "Price falls from $10 to $8. Using the midpoint method, the magnitude of the percentage price change is approximately:", "ch": ["25.0%.", "20.0%.", "2.0%.", "22.2%."], "a": 3, "ex": "The average price is 9. The change magnitude is 2 / 9 x 100 = 22.2%.", "fig": null}, {"n": 124, "lec": 5, "q": "Price rises from $4 to $6, and quantity falls from 120 to 80. Using midpoint percentages, demand is:", "ch": ["Inelastic, with elasticity magnitude 0.5.", "Perfectly inelastic, with elasticity 0.", "Unit elastic, with elasticity magnitude 1.", "Elastic, with elasticity magnitude 2."], "a": 2, "ex": "Price changes by 2 / 5 = 40%; quantity changes by 40 / 100 = 40%. Their ratio is 1.", "fig": null}, {"n": 125, "lec": 5, "q": "Why use the midpoint method when comparing two price-quantity points?", "ch": ["It removes the need to calculate a quantity change.", "It assumes quantity never changes.", "It always makes demand unit elastic.", "It gives the same elasticity magnitude whichever point is treated as the starting point."], "a": 3, "ex": "Both directions use the same average denominators, avoiding a dependence on the chosen starting point.", "fig": null}, {"n": 126, "lec": 5, "q": "A vertical demand curve is:", "ch": ["Always unit elastic.", "Elastic only above its midpoint.", "Perfectly inelastic.", "Perfectly elastic."], "a": 2, "ex": "Quantity is unchanged when price changes, so the percentage quantity response and elasticity are zero.", "fig": null}, {"n": 127, "lec": 5, "q": "A horizontal demand curve is:", "ch": ["Perfectly elastic.", "Perfectly inelastic.", "Always unit elastic.", "A curve with elasticity zero."], "a": 0, "ex": "At the given price consumers are extremely responsive to price differences; this is the limiting case of infinite elasticity.", "fig": null}, {"n": 128, "lec": 5, "q": "Which situation tends to make demand more elastic?", "ch": ["The good has no close substitutes.", "Many close substitutes are readily available.", "The good is essential and difficult to replace.", "Buyers have almost no time to adjust."], "a": 1, "ex": "Substitutes make it easier to reduce purchases when price rises.", "fig": null}, {"n": 129, "lec": 5, "q": "Which demand is typically more elastic, other things equal?", "ch": ["Both must have elasticity exactly 1.", "Demand for all food combined.", "Demand for one particular brand of cereal.", "The broader category must always be more elastic."], "a": 2, "ex": "A narrowly defined product has more close substitutes than a broad category such as all food.", "fig": null}, {"n": 130, "lec": 5, "q": "Why is demand often more elastic over a longer time period?", "ch": ["Consumers have more opportunities to change habits or find substitutes.", "Demand necessarily becomes vertical.", "All goods become inferior over time.", "Prices stop affecting choices after enough time."], "a": 0, "ex": "Adjustment takes time; consumers may replace equipment, move, or change routines.", "fig": null}, {"n": 131, "lec": 5, "q": "A seller raises price by a small amount in a range where demand is elastic. Total revenue will:", "ch": ["Equal total profit.", "Rise.", "Stay unchanged in every case.", "Fall."], "a": 3, "ex": "With elastic demand, the percentage quantity loss outweighs the percentage price gain.", "fig": null}, {"n": 132, "lec": 5, "q": "A seller raises price by a small amount in a range where demand is inelastic. Total revenue will:", "ch": ["Become negative.", "Fall.", "Stay unchanged in every case.", "Rise."], "a": 3, "ex": "The percentage quantity reduction is smaller than the percentage price increase, so price times quantity rises.", "fig": null}, {"n": 133, "lec": 5, "q": "Price falls from $12 to $10 and sales rise from 50 to 65 units. What happens to total revenue?", "ch": ["It rises by $50.", "It falls by $50.", "It stays at $600.", "It rises by $150."], "a": 0, "ex": "Initial revenue is 12 x 50 = 600. New revenue is 10 x 65 = 650, an increase of 50.", "fig": null}, {"n": 134, "lec": 5, "q": "Demand is inelastic in the relevant range. If a producer wants to increase total revenue through a small price change, it should:", "ch": ["Lower price.", "Keep price fixed because revenue cannot change.", "Increase production without considering price.", "Raise price."], "a": 3, "ex": "With inelastic demand, a price rise increases total revenue. This alone does not establish what maximizes profit.", "fig": null}, {"n": 135, "lec": 5, "q": "Which statement about a straight downward-sloping demand curve is correct?", "ch": ["Its constant slope makes elasticity constant everywhere.", "It is perfectly inelastic near the price intercept.", "It is perfectly elastic at every point.", "Its slope is constant, but its elasticity generally changes along the curve."], "a": 3, "ex": "Elasticity depends on percentage changes and the price-to-quantity ratio, not just the curve's slope.", "fig": null}, {"n": 136, "lec": 5, "q": "Income rises by 12% and quantity demanded rises by 9%. Income elasticity is:", "ch": ["0.75; the good is normal and income-inelastic.", "Minus 0.75; the good is inferior.", "3; the good is a luxury.", "1.33; the good is inferior."], "a": 0, "ex": "Income elasticity is 9 / 12 = 0.75. Its positive sign indicates a normal good and its size below 1 indicates income-inelastic demand.", "fig": null}, {"n": 137, "lec": 5, "q": "Income rises by 8% and quantity demanded falls by 4%. This good is:", "ch": ["Normal, with income elasticity 0.5.", "Inferior, with income elasticity -2.", "A luxury, with income elasticity 2.", "Inferior, with income elasticity -0.5."], "a": 3, "ex": "The ratio is -4 / 8 = -0.5. A negative income elasticity identifies an inferior good.", "fig": null}, {"n": 138, "lec": 5, "q": "A good has income elasticity 1.6. It is classified as:", "ch": ["An inferior good.", "A normal good with income-inelastic demand.", "A normal good with income-elastic demand.", "A good with perfectly inelastic price demand."], "a": 2, "ex": "The positive sign means normal; greater than 1 means quantity responds more than proportionately to income.", "fig": null}, {"n": 139, "lec": 5, "q": "The price of tea rises by 10%, and demand for coffee rises by 6%. Coffee's cross-price elasticity with respect to tea's price is:", "ch": ["-0.6, suggesting complements.", "-1.67, suggesting substitutes.", "+0.6, suggesting substitutes.", "+1.67, suggesting complements."], "a": 2, "ex": "Divide coffee's quantity change by tea's price change: 6 / 10 = +0.6. A positive cross-price elasticity suggests substitutes.", "fig": null}, {"n": 140, "lec": 5, "q": "The price of printers rises by 15%, and quantity demanded of ink falls by 30%. Cross-price elasticity of ink with respect to printer price is:", "ch": ["+2, suggesting substitutes.", "-0.5, suggesting substitutes.", "-2, suggesting complements.", "+0.5, suggesting complements."], "a": 2, "ex": "The ratio is -30 / 15 = -2. A negative cross-price elasticity suggests the goods are used together.", "fig": null}, {"n": 141, "lec": 5, "q": "Price rises by 5% and quantity supplied rises by 15%. Supply elasticity is:", "ch": ["3.", "20.", "10.", "0.33."], "a": 0, "ex": "Supply elasticity is percentage change in quantity supplied divided by percentage change in price: 15 / 5 = 3.", "fig": null}, {"n": 142, "lec": 5, "q": "Which condition generally makes supply less elastic in the short run?", "ch": ["Production requires scarce inputs that are difficult to obtain quickly.", "Firms have unused capacity and abundant inputs.", "New firms can enter immediately at unchanged costs.", "Production can expand easily with existing equipment."], "a": 0, "ex": "Difficulty expanding output limits the quantity response to a price change.", "fig": null}, {"n": 143, "lec": 5, "q": "Consumer income rises from $900 to $1,100 and purchases rise from 45 to 55 units. Using midpoint percentages, income elasticity is:", "ch": ["2.", "10.", "1.", "0.5."], "a": 2, "ex": "Income rises by 200 / 1000 = 20%; quantity rises by 10 / 50 = 20%. The ratio is 1.", "fig": null}, {"n": 144, "lec": 5, "q": "Two demand curves pass through the same price and quantity, with identical axis scales. At that point, the flatter curve has:", "ch": ["Less elastic demand.", "Exactly the same elasticity necessarily.", "Zero elasticity.", "More elastic demand."], "a": 3, "ex": "At the same price and quantity, a flatter curve implies a larger quantity response to a given price change. This comparison requires consistent axes.", "fig": null}, {"n": 145, "lec": 5, "q": "On the straight demand curve in Figure 5, which labelled point is in the elastic region?", "ch": ["C.", "A.", "All three points are unit elastic.", "B."], "a": 1, "ex": "The upper portion of a straight demand curve is elastic. A has high price and low quantity relative to the midpoint.", "fig": 5}, {"n": 146, "lec": 5, "q": "At which labelled point in Figure 5 is demand unit elastic?", "ch": ["None of the labelled points.", "A.", "B.", "C."], "a": 2, "ex": "B is the midpoint between the intercepts: Q = 3, P = 6. Elasticity magnitude there is 1.", "fig": 5}, {"n": 147, "lec": 5, "q": "Which labelled point in Figure 5 is in the inelastic region?", "ch": ["C.", "All three points are perfectly elastic.", "B.", "A."], "a": 0, "ex": "The lower portion of a straight demand curve is inelastic: price is low and quantity is high.", "fig": 5}, {"n": 148, "lec": 5, "q": "What is total revenue at point B in Figure 5?", "ch": ["$18", "$12", "$9", "$36"], "a": 0, "ex": "At B, P = 6 and Q = 3, so total revenue is 6 x 3 = 18.", "fig": 5}, {"n": 149, "lec": 5, "q": "Using the midpoint method between A and B in Figure 5, the magnitude of demand elasticity is:", "ch": ["2.", "4.", "0.5.", "1."], "a": 0, "ex": "Quantity rises from 1 to 3: 2 / 2 = 100%. Price falls from 10 to 6: 4 / 8 = 50%. Elasticity magnitude is 100 / 50 = 2.", "fig": 5}, {"n": 150, "lec": 5, "q": "Using the midpoint method between B and C in Figure 5, the magnitude of demand elasticity is:", "ch": ["4.", "1.", "0.5.", "2."], "a": 2, "ex": "Quantity rises from 3 to 5: 2 / 4 = 50%. Price falls from 6 to 2: 4 / 4 = 100%. Elasticity magnitude is 50 / 100 = 0.5.", "fig": 5}, {"n": 151, "lec": 6, "q": "A per-unit tax creates which relationship between the price paid by buyers and the net price received by sellers?", "ch": ["Buyer price minus seller price equals the tax.", "Both prices must rise by the full tax.", "Seller price minus buyer price equals the tax.", "Both prices must remain equal."], "a": 0, "ex": "The tax creates a wedge: Pb - Ps = t. Buyers' payment includes the amount passed to government.", "fig": null}, {"n": 152, "lec": 6, "q": "A $12 per-unit tax is introduced. Buyer price rises from $30 to $38 and sellers receive $26 after tax. The economic burden is:", "ch": ["$8 on buyers and $4 on sellers per unit.", "$4 on buyers and $8 on sellers per unit.", "$12 on buyers and $12 on sellers per unit.", "$38 on buyers and $26 on sellers per unit."], "a": 0, "ex": "Compare both prices with the original $30: buyers pay 8 more and sellers receive 4 less. The burdens sum to 12.", "fig": null}, {"n": 153, "lec": 6, "q": "Demand is much less elastic than supply. Who generally bears more of a per-unit tax?", "ch": ["Sellers.", "Both sides necessarily split it equally.", "The side legally required to remit it, regardless of elasticities.", "Buyers."], "a": 3, "ex": "The less elastic side has less ability to avoid the taxed activity and generally bears more of the burden.", "fig": null}, {"n": 154, "lec": 6, "q": "Supply is much less elastic than demand. Who generally bears more of a per-unit tax?", "ch": ["Sellers.", "Buyers.", "Both sides necessarily pay exactly half.", "Only the government."], "a": 0, "ex": "Less responsive sellers cannot reduce participation as easily, so their net price falls by more.", "fig": null}, {"n": 155, "lec": 6, "q": "In the standard competitive model, changing which side legally remits a given per-unit tax generally:", "ch": ["Makes the tax revenue zero.", "Eliminates the reduction in quantity.", "Leaves the equilibrium economic burden unchanged.", "Makes that side bear the entire tax."], "a": 2, "ex": "Legal remittance and economic incidence are different. The same wedge and elasticities determine buyer and seller prices.", "fig": null}, {"n": 156, "lec": 6, "q": "In a graph with buyer price on the vertical axis, a $3 per-unit tax collected from sellers can be shown as:", "ch": ["An upward demand shift of $3.", "An upward supply shift of $3.", "A rightward demand shift of 3 units at every price.", "A downward supply shift of $3."], "a": 1, "ex": "Sellers need a buyer payment $3 above their original supply price to receive the same net amount.", "fig": null}, {"n": 157, "lec": 6, "q": "In a graph with seller receipts on the vertical axis, a $3 per-unit tax collected from buyers can be shown as:", "ch": ["A horizontal supply shift of exactly 3 units.", "A downward supply shift of $3.", "A downward demand shift of $3.", "An upward demand shift of $3."], "a": 2, "ex": "Buyers subtract the tax from the amount they are willing to pay sellers directly.", "fig": null}, {"n": 158, "lec": 6, "q": "A tax is $5 per unit and 400 units are traded after the tax. Government tax revenue is:", "ch": ["$405.", "$80.", "$5,000 regardless of the quantity traded.", "$2,000."], "a": 3, "ex": "Revenue equals the tax times the quantity actually traded after the tax: 5 x 400 = 2000.", "fig": null}, {"n": 159, "lec": 6, "q": "A market originally trades 100 units. After a $4 tax, it trades 75 units. Government revenue is:", "ch": ["$700.", "$300.", "$400.", "$100."], "a": 1, "ex": "Apply the tax to the remaining 75 transactions, not the original 100: 4 x 75 = 300.", "fig": null}, {"n": 160, "lec": 6, "q": "A $6 per-unit subsidy creates which relationship?", "ch": ["Seller receipts minus buyer price equals $6.", "Buyer and seller prices must be identical.", "Both sides pay $6 to the government.", "Buyer price minus seller receipts equals $6."], "a": 0, "ex": "A subsidy bridges what buyers pay and what sellers receive: Ps - Pb = s.", "fig": null}, {"n": 161, "lec": 6, "q": "Before a subsidy, price is $20. After a $5 subsidy, buyers pay $18 and sellers receive $23. The gains per unit are:", "ch": ["$18 for buyers and $23 for sellers.", "$3 for buyers and $2 for sellers.", "$2 for buyers and $3 for sellers.", "$5 for buyers and $5 for sellers."], "a": 2, "ex": "Compare each side's price with the original $20. The benefits sum to the $5 subsidy.", "fig": null}, {"n": 162, "lec": 6, "q": "A subsidy of $7 per unit supports 250 transactions. What is government spending?", "ch": ["$1,750.", "$7,000.", "$257.", "$35."], "a": 0, "ex": "The government pays the subsidy on each subsidized transaction: 7 x 250 = 1750.", "fig": null}, {"n": 163, "lec": 6, "q": "In the usual competitive market with no externality, a per-unit subsidy generally:", "ch": ["Reduces quantity and raises buyer price.", "Leaves quantity unchanged in every case.", "Raises buyer price and lowers seller receipts.", "Increases traded quantity, lowers buyer price, and raises seller receipts."], "a": 3, "ex": "A subsidy encourages trade by reducing buyers' effective cost and increasing sellers' effective return.", "fig": null}, {"n": 164, "lec": 6, "q": "If supply is much less elastic than demand, which side generally receives more of a per-unit subsidy's benefit?", "ch": ["Sellers.", "Buyers.", "Only the side legally receiving the government payment.", "Both sides must get exactly half."], "a": 0, "ex": "The less elastic side generally captures more of the subsidy through the price adjustment.", "fig": null}, {"n": 165, "lec": 6, "q": "A price ceiling is binding when it is set:", "ch": ["Below the market's uncontrolled equilibrium price.", "Above the market's uncontrolled equilibrium price.", "At any positive price, regardless of equilibrium.", "Only when supply is horizontal."], "a": 0, "ex": "A ceiling restricts the maximum legal price. It matters when the market-clearing price would be higher.", "fig": null}, {"n": 166, "lec": 6, "q": "Equilibrium rent is $1,200. A maximum legal rent of $1,500 is introduced. In the basic model this ceiling:", "ch": ["Raises market rent to $1,500 automatically.", "Creates a shortage because every ceiling must do so.", "Creates a surplus of apartments.", "Is nonbinding, leaving the market equilibrium unchanged."], "a": 3, "ex": "The equilibrium price already satisfies the ceiling, so the restriction does not constrain it.", "fig": null}, {"n": 167, "lec": 6, "q": "A binding price floor in a competitive market tends to create:", "ch": ["A rightward demand shift automatically.", "Excess demand.", "Excess supply.", "No gap between quantity demanded and supplied."], "a": 2, "ex": "Above equilibrium, sellers offer more than buyers want, so quantity supplied exceeds quantity demanded.", "fig": null}, {"n": 168, "lec": 6, "q": "A minimum wage is set below the current competitive equilibrium wage. In the basic model it is:", "ch": ["Binding and certain to create unemployment.", "A binding price ceiling.", "Guaranteed to lower every worker's wage.", "Nonbinding."], "a": 3, "ex": "A floor below equilibrium does not constrain the equilibrium wage.", "fig": null}, {"n": 169, "lec": 6, "q": "At a binding price ceiling, Qd = 120 and Qs = 70. Without government supply and assuming willing traders can be matched, traded quantity is:", "ch": ["50.", "120.", "190.", "70."], "a": 3, "ex": "The 70 units offered limit trade. The shortage is 50, which is a different number.", "fig": null}, {"n": 170, "lec": 6, "q": "At a binding price floor, Qd = 40 and Qs = 90. With no government purchases and willing traders matched, private traded quantity is:", "ch": ["130.", "50.", "90.", "40."], "a": 3, "ex": "Only 40 units are demanded at that price, so private transactions are limited by demand.", "fig": null}, {"n": 171, "lec": 6, "q": "An effective production quota limits total sales below the competitive equilibrium quantity. With ordinary downward-sloping demand, it tends to:", "ch": ["Raise market price and reduce quantity traded.", "Raise both price and quantity traded.", "Lower price and increase quantity traded.", "Leave quantity unconstrained."], "a": 0, "ex": "Restricting the available quantity below equilibrium moves the market to a higher willingness-to-pay point on demand.", "fig": null}, {"n": 172, "lec": 6, "q": "Suppose a tax must reduce quantity to 50. At Q = 50, the demand curve is at $18 and the original supply curve is at $12. The required per-unit tax is:", "ch": ["$30.", "$18.", "$6.", "$12."], "a": 2, "ex": "At the target quantity, the tax wedge must equal the vertical gap between demand and supply: 18 - 12 = 6.", "fig": null}, {"n": 173, "lec": 6, "q": "A binding price ceiling is removed. With curves unchanged and ordinary slopes, the basic model predicts:", "ch": ["Price rises and traded quantity falls.", "Demand shifts right automatically.", "Price and traded quantity both rise toward equilibrium.", "Price falls and traded quantity rises."], "a": 2, "ex": "Under the ceiling, quantity supplied limits trade. Raising price toward equilibrium increases that quantity while reducing the shortage.", "fig": null}, {"n": 174, "lec": 6, "q": "What is a key role of secure property rights and enforceable contracts in markets?", "ch": ["They guarantee that all market outcomes are equally distributed.", "They require the government to set every price.", "They help people exchange by making ownership and agreements more reliable.", "They eliminate every opportunity cost."], "a": 2, "ex": "Clear ownership and enforceable agreements support transactions, investment, and incentives.", "fig": null}, {"n": 175, "lec": 6, "q": "In Figure 6, what is the per-unit tax represented by the vertical distance between S and S + tax?", "ch": ["$2.", "$10.", "$6.", "$4."], "a": 3, "ex": "The shifted supply curve is P = 6 + Q while original supply is P = 2 + Q; the vertical gap is 4.", "fig": 6}, {"n": 176, "lec": 6, "q": "In Figure 6, what quantity is traded after the tax?", "ch": ["6 units.", "4 units.", "10 units.", "8 units."], "a": 1, "ex": "The tax-inclusive supply curve intersects demand at Q = 4: 14 - Q = 6 + Q.", "fig": 6}, {"n": 177, "lec": 6, "q": "In Figure 6, what price do buyers pay after the tax?", "ch": ["$6.", "$10.", "$8.", "$14."], "a": 1, "ex": "At the post-tax quantity Q = 4, the demand curve gives buyer price P = 14 - 4 = 10.", "fig": 6}, {"n": 178, "lec": 6, "q": "In Figure 6, what do sellers receive per unit after remitting the tax?", "ch": ["$8.", "$10.", "$4.", "$6."], "a": 3, "ex": "Buyers pay 10 and the tax is 4, so sellers keep 6. This is also original supply's height at Q = 4.", "fig": 6}, {"n": 179, "lec": 6, "q": "In Figure 6, how is the tax burden divided per unit relative to the original equilibrium?", "ch": ["Buyers bear $6 and sellers bear $10.", "Buyers bear $4 and sellers bear $0.", "Buyers bear $2 and sellers bear $2.", "Buyers bear $0 and sellers bear $4."], "a": 2, "ex": "The original price is 8. Buyers now pay 10, an increase of 2; sellers receive 6, a decrease of 2.", "fig": 6}, {"n": 180, "lec": 6, "q": "What is government tax revenue in Figure 6?", "ch": ["$40.", "$24.", "$8.", "$16."], "a": 3, "ex": "The $4 tax applies to 4 traded units: revenue is 4 x 4 = 16.", "fig": 6}, {"n": 181, "lec": 7, "q": "A buyer values a good at $28 and pays $19. Consumer surplus is:", "ch": ["$19.", "$47.", "$28.", "$9."], "a": 3, "ex": "Consumer surplus is willingness to pay minus the amount paid: 28 - 19 = 9.", "fig": null}, {"n": 182, "lec": 7, "q": "Compared with a competitive market, a firm with substantial market power may reduce efficiency by:", "ch": ["Producing every unit for which marginal cost exceeds marginal benefit.", "Restricting output and charging a higher price.", "Eliminating all scarcity.", "Ensuring that all potential gains from trade are realized."], "a": 1, "ex": "Market power can allow sellers to restrict output below the efficient competitive quantity, leaving some beneficial trades unrealized.", "fig": null}, {"n": 183, "lec": 7, "q": "A buyer values an item at $28, a seller's opportunity cost is $11, and the item trades for $19. Total surplus is:", "ch": ["$8.", "$9.", "$17.", "$47."], "a": 2, "ex": "Total surplus is 28 - 11 = 17. Equivalently, add consumer surplus 9 and producer surplus 8.", "fig": null}, {"n": 184, "lec": 7, "q": "In an otherwise unchanged one-unit trade, price rises from $19 to $22. What happens to total surplus if the buyer and seller still trade?", "ch": ["It stays unchanged, while $3 shifts from buyer surplus to seller surplus.", "It becomes equal to the new price.", "It rises by $3.", "It falls by $3."], "a": 0, "ex": "The trade's total gain is willingness to pay minus opportunity cost. Price divides that gain between the parties.", "fig": null}, {"n": 185, "lec": 7, "q": "On a standard demand-supply diagram, consumer surplus is the area:", "ch": ["Below demand and above the buyer price, up to the quantity bought.", "Between the supply curve and seller price, up to quantity sold.", "Above demand and below the buyer price.", "Below supply and above the horizontal axis only."], "a": 0, "ex": "The demand curve measures willingness to pay; the gap above the amount paid is the buyer's surplus.", "fig": null}, {"n": 186, "lec": 7, "q": "On a standard diagram, producer surplus is the area:", "ch": ["Above supply and below the seller's net price, up to quantity sold.", "Equal to all sales revenue regardless of costs.", "Above demand and below buyer price.", "Below supply and above the horizontal axis only."], "a": 0, "ex": "The supply curve reflects marginal opportunity costs. The area between net price and those costs measures producer surplus.", "fig": null}, {"n": 187, "lec": 7, "q": "A firm's producer surplus is $500 and its fixed costs are $180. With no other costs omitted, profit is:", "ch": ["$180.", "$320.", "$500.", "$680."], "a": 1, "ex": "Producer surplus is revenue less variable costs. Subtract fixed costs to get profit: 500 - 180 = 320.", "fig": null}, {"n": 188, "lec": 7, "q": "In a competitive market without externalities or other market failures, the efficient quantity satisfies:", "ch": ["Consumer surplus equals producer surplus necessarily.", "Marginal benefit equals marginal cost.", "Total benefit equals zero.", "Price equals fixed cost."], "a": 1, "ex": "The efficient stopping point is where another unit's benefit equals its cost; all earlier beneficial units are produced.", "fig": null}, {"n": 189, "lec": 7, "q": "An additional unit would generate a marginal benefit of $16 and marginal cost of $10. Producing it changes total surplus by:", "ch": ["Minus $10.", "Plus $16.", "Plus $6.", "Minus $6."], "a": 2, "ex": "Its added net social gain is 16 - 10 = 6, assuming the values include all relevant benefits and costs.", "fig": null}, {"n": 190, "lec": 7, "q": "A market has many competing firms and no spillovers, but buyers systematically make decisions that do not reflect their true benefits and costs. Why might the outcome still be inefficient?", "ch": ["Inefficiency requires a tax in every case.", "Irrational or poorly informed choices can prevent the market from maximizing surplus.", "Every high price proves that production is efficient.", "Competition guarantees efficiency regardless of the quality of decisions."], "a": 1, "ex": "Competition alone is not sufficient: the decisions underlying demand and supply must reflect relevant benefits and costs. Irrationality and information problems can interfere.", "fig": null}, {"n": 191, "lec": 7, "q": "For a given number of identical units, efficiency requires allocating them to:", "ch": ["Buyers with the highest willingness to pay.", "Only whichever buyers arrive last.", "Every buyer regardless of valuation.", "Buyers with the lowest willingness to pay."], "a": 0, "ex": "Allocating units to the highest-valuing uses maximizes the measured benefits from a fixed quantity.", "fig": null}, {"n": 192, "lec": 7, "q": "For a given quantity of identical output, efficiency requires production by:", "ch": ["Only sellers who charge the highest price.", "The largest firms regardless of costs.", "Sellers with the highest opportunity costs.", "Sellers with the lowest opportunity costs."], "a": 3, "ex": "Using the lowest-cost producers minimizes the resources sacrificed for that output.", "fig": null}, {"n": 193, "lec": 7, "q": "Which statement correctly distinguishes efficiency from equity?", "ch": ["An equal distribution always maximizes total surplus.", "An efficient outcome must give everyone identical income.", "Efficiency means every person's willingness to pay is identical.", "An outcome can maximize total surplus while distributing gains very unevenly."], "a": 3, "ex": "Efficiency concerns total gains; equity concerns how outcomes are distributed. They are different questions.", "fig": null}, {"n": 194, "lec": 7, "q": "Why can willingness to pay be an imperfect measure of how urgently people need a good?", "ch": ["It is always unrelated to anyone's preferences.", "It is identical for all income levels by definition.", "It depends on ability to pay as well as preferences.", "It measures production cost only."], "a": 2, "ex": "A low-income person's high need may not translate into high purchasing power, so market efficiency is not a complete fairness judgment.", "fig": null}, {"n": 195, "lec": 7, "q": "A straight demand curve meets the price axis at $20. Equilibrium price is $12 and quantity is 50. Consumer surplus is:", "ch": ["$600.", "$1,000.", "$200.", "$400."], "a": 2, "ex": "The triangle has height 20 - 12 = 8 and base 50. Its area is 0.5 x 50 x 8 = 200.", "fig": null}, {"n": 196, "lec": 7, "q": "A straight supply curve meets the price axis at $4. Seller price is $10 and quantity is 80. Producer surplus is:", "ch": ["$800.", "$240.", "$480.", "$320."], "a": 1, "ex": "The triangle has height 10 - 4 = 6 and base 80. Its area is 0.5 x 80 x 6 = 240.", "fig": null}, {"n": 197, "lec": 7, "q": "A surplus triangle has height $6 per unit and horizontal base 20 thousand units. Its dollar value is:", "ch": ["$120,000.", "$60,000.", "$6,000.", "$60."], "a": 1, "ex": "Area is 0.5 x 6 x 20,000 = 60,000. The quantity axis is in thousands, so include that scale.", "fig": null}, {"n": 198, "lec": 7, "q": "Why is tax revenue not itself deadweight loss in the basic surplus analysis?", "ch": ["It equals the entire consumer surplus before tax.", "It is a transfer to government, while deadweight loss is surplus that disappears.", "It always returns to exactly the same buyers immediately.", "Taxes never change total surplus."], "a": 1, "ex": "Revenue still accrues to someone. Deadweight loss instead reflects the lost net gains from transactions that no longer occur.", "fig": null}, {"n": 199, "lec": 7, "q": "With no externalities, how is total surplus calculated after a per-unit tax?", "ch": ["Consumer surplus plus producer surplus plus government tax revenue.", "Consumer surplus minus producer surplus.", "Tax revenue alone.", "Consumer surplus plus producer surplus minus tax revenue."], "a": 0, "ex": "Government receipts are included alongside the remaining buyer and seller surpluses.", "fig": null}, {"n": 200, "lec": 7, "q": "With no externalities, how is total surplus calculated after a per-unit subsidy?", "ch": ["Consumer surplus plus producer surplus plus subsidy spending.", "Consumer surplus plus producer surplus minus government subsidy spending.", "Consumer surplus minus producer surplus plus spending.", "Only the gains received by buyers."], "a": 1, "ex": "A subsidy uses public funds, so subtract its cost rather than counting the same money as a new social gain.", "fig": null}, {"n": 201, "lec": 7, "q": "Starting from an efficient equilibrium with straight demand and supply curves, a $6 tax reduces quantity from 100 to 80. Deadweight loss is:", "ch": ["$600.", "$480.", "$120.", "$60."], "a": 3, "ex": "The lost-surplus triangle is 0.5 x tax x quantity reduction = 0.5 x 6 x 20 = 60.", "fig": null}, {"n": 202, "lec": 7, "q": "A factory's production creates uncompensated air pollution harming nearby residents. In the basic externality analysis, an unregulated market tends to:", "ch": ["Produce too much because producers and buyers do not bear all social costs.", "Produce the efficient quantity automatically in every case.", "Have no externality because residents are not customers.", "Produce too little because pollution is a benefit."], "a": 0, "ex": "A negative externality imposes costs on outsiders that private decisions leave out, encouraging excessive output relative to the social optimum.", "fig": null}, {"n": 203, "lec": 7, "q": "A vaccination benefits its recipient and also reduces infection risk for other people. The unassisted market may:", "ch": ["Have no outside effects by definition.", "Always make private benefit greater than total social benefit.", "Provide too much because all outside benefits are counted in private demand.", "Provide too little because buyers do not capture all the benefits."], "a": 3, "ex": "Positive spillover benefits can make the socially desirable quantity larger than the quantity chosen privately.", "fig": null}, {"n": 204, "lec": 7, "q": "Which example most directly illustrates a problem of asymmetric informat
