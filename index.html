ion?", "ch": ["A storm physically destroys crops.", "Consumer income rises.", "A factory invents a cheaper production method and publicly explains it.", "A used-car seller knows about a hidden engine defect that the buyer cannot observe."], "a": 3, "ex": "Asymmetric information means one party knows relevant information that the other party lacks; it can prevent mutually beneficial or well-informed trades.", "fig": null}, {"n": 205, "lec": 7, "q": "What is consumer surplus at the competitive equilibrium in Figure 7?", "ch": ["$18.", "$8.", "$36.", "$48."], "a": 0, "ex": "The demand intercept is 14, equilibrium price is 8, and quantity is 6. CS = 0.5 x (14 - 8) x 6 = 18.", "fig": 7}, {"n": 206, "lec": 7, "q": "What is producer surplus at the competitive equilibrium in Figure 7?", "ch": ["$18.", "$12.", "$48.", "$36."], "a": 0, "ex": "The supply intercept is 2. PS = 0.5 x (8 - 2) x 6 = 18.", "fig": 7}, {"n": 207, "lec": 7, "q": "What is total surplus at the competitive equilibrium in Figure 7?", "ch": ["$36.", "$48.", "$18.", "$84."], "a": 0, "ex": "Add consumer surplus 18 and producer surplus 18. This also equals the full triangle between demand and supply up to Q = 6.", "fig": 7}, {"n": 208, "lec": 7, "q": "In Figure 7, suppose only the first 4 units are produced and allocated efficiently. Relative to equilibrium, deadweight loss is:", "ch": ["$24.", "$8.", "$16.", "$4."], "a": 3, "ex": "At Q = 4, marginal benefit is 10 and marginal cost is 6, a gap of 4. Lost trades span 2 units, giving 0.5 x 2 x 4 = 4.", "fig": 7}, {"n": 209, "lec": 7, "q": "In Figure 7, suppose a $4 tax reduces quantity to 4, with buyers paying $10 and sellers receiving $6. Consumer surplus plus producer surplus plus tax revenue is:", "ch": ["$16.", "$48.", "$36.", "$32."], "a": 3, "ex": "CS = 0.5 x 4 x 4 = 8, PS = 8, and tax revenue = 4 x 4 = 16. Total is 32, below the original 36 by DWL of 4.", "fig": 7}, {"n": 210, "lec": 7, "q": "Using Figure 7's curves, suppose output is pushed from the efficient 6 units to 8 units. With no externality and efficient allocation, the extra units cause a surplus loss of:", "ch": ["$4.", "$2.", "$8.", "$16."], "a": 0, "ex": "At Q = 8, MC = 10 exceeds MB = 6 by 4. The excess-output triangle has base 2 and height 4, so its area is 4.", "fig": 7}, {"n": 211, "lec": 8, "q": "Absolute advantage in producing a good means being able to:", "ch": ["Produce it only if nobody else can.", "Produce more of it with the same resources, or use fewer resources per unit.", "Sell it at a higher price than every other producer.", "Produce it at a lower opportunity cost, by definition."], "a": 1, "ex": "Absolute advantage concerns productivity. Comparative advantage concerns the sacrifice of other output.", "fig": null}, {"n": 212, "lec": 8, "q": "Comparative advantage in a good means having:", "ch": ["A larger population.", "A lower opportunity cost of producing it.", "A lower money price regardless of opportunity cost.", "A higher output of every good necessarily."], "a": 1, "ex": "Compare the amount of the other good forgone per unit; the lower sacrifice identifies comparative advantage.", "fig": null}, {"n": 213, "lec": 8, "q": "In one hour, Alex can make 12 sandwiches or 6 salads. What is Alex's opportunity cost of one sandwich?", "ch": ["2 salads.", "0.5 salad.", "12 salads.", "6 salads."], "a": 1, "ex": "Forgoing 6 salads enables 12 sandwiches, so the cost is 6 / 12 = 0.5 salad per sandwich.", "fig": null}, {"n": 214, "lec": 8, "q": "In one hour, Alex can make 12 sandwiches or 6 salads. What is Alex's opportunity cost of one salad?", "ch": ["12 sandwiches.", "6 sandwiches.", "0.5 sandwich.", "2 sandwiches."], "a": 3, "ex": "The ratio is 12 / 6 = 2 sandwiches per salad. The reverse opportunity costs are reciprocals in this two-good linear model.", "fig": null}, {"n": 215, "lec": 8, "q": "In one hour, Alex can make 12 sandwiches or 6 salads; Blair can make 8 sandwiches or 8 salads. Who has comparative advantage in sandwiches?", "ch": ["Blair.", "Neither because Alex cannot make more salads.", "Alex.", "Both have equal opportunity costs."], "a": 2, "ex": "Alex gives up 0.5 salad per sandwich; Blair gives up 1. Alex has the lower opportunity cost.", "fig": null}, {"n": 216, "lec": 8, "q": "Using Alex's output of 12 sandwiches or 6 salads and Blair's output of 8 sandwiches or 8 salads per hour, who has comparative advantage in salads?", "ch": ["Blair.", "Neither can gain by specialization.", "Both have the same comparative advantage.", "Alex."], "a": 0, "ex": "A salad costs Blair 1 sandwich but Alex 2 sandwiches, so Blair has the lower cost.", "fig": null}, {"n": 217, "lec": 8, "q": "A person is more productive than another person in making both goods. Which conclusion follows?", "ch": ["The more productive person must have comparative advantage in both.", "Trade cannot help either person.", "The more productive person has absolute advantage in both but need not have comparative advantage in both.", "The less productive person's opportunity costs are necessarily higher for both goods."], "a": 2, "ex": "Relative productivity determines opportunity costs. A producer with absolute advantage in both goods can still specialize and trade beneficially.", "fig": null}, {"n": 218, "lec": 8, "q": "Using equal resources, A can make 20 X or 10 Y, while B can make 6 X or 6 Y. Which statement is correct?", "ch": ["B has comparative advantage in X.", "B has absolute advantage in both goods.", "A has comparative advantage in both goods.", "A has absolute advantage in both goods, but B has comparative advantage in Y."], "a": 3, "ex": "A produces more of each. However, Y costs A 2 X and B only 1 X, giving B comparative advantage in Y.", "fig": null}, {"n": 219, "lec": 8, "q": "A takes 2 hours per chair and 1 hour per table. What is the opportunity cost of one chair?", "ch": ["1 table.", "2 tables.", "0.5 table.", "3 tables."], "a": 1, "ex": "A chair uses 2 hours, during which A could make 2 tables. For time-per-unit data, divide the time for the chosen good by time for the forgone good.", "fig": null}, {"n": 220, "lec": 8, "q": "A takes 2 hours per chair and 1 hour per table. B takes 3 hours per chair and 3 hours per table. Who has comparative advantage in chairs?", "ch": ["B.", "Neither because B is slower at both.", "Both because each can make a chair.", "A."], "a": 0, "ex": "A chair costs A 2 tables but B only 1 table. B's lower opportunity cost matters even though B takes more time.", "fig": null}, {"n": 221, "lec": 8, "q": "Two producers have exactly the same opportunity cost ratios and linear production possibilities. Specializing according to comparative advantage:", "ch": ["Guarantees each has comparative advantage in a different good.", "Always doubles total output.", "Does not create a comparative-advantage production gain between them.", "Makes both goods costless to produce."], "a": 2, "ex": "Identical trade-offs leave no relative-cost difference to exploit in this simple model.", "fig": null}, {"n": 222, "lec": 8, "q": "What does a point inside a production possibilities frontier indicate?", "ch": ["Output is impossible with current resources.", "The maximum possible output of both goods is achieved simultaneously.", "The economy has eliminated scarcity.", "Output is feasible, but resources are idle or used inefficiently."], "a": 3, "ex": "An interior point leaves room to produce more of at least one good without reducing the other.", "fig": null}, {"n": 223, "lec": 8, "q": "What does a point outside the current PPF indicate?", "ch": ["It is unattainable as a production combination with current resources and technology.", "It can always be reached simply by employing idle resources.", "It is the only efficient production point.", "It is necessarily inefficient but currently feasible."], "a": 0, "ex": "The frontier already marks the maximum feasible combinations. Reaching an outside production point requires expanded capabilities.", "fig": null}, {"n": 224, "lec": 8, "q": "Moving along a PPF from one efficient point to another usually involves:", "ch": ["Moving from impossible to feasible production.", "Increasing production of both goods without a trade-off.", "Producing more of one good by giving up some of the other.", "Increasing the economy's productive capacity."], "a": 2, "ex": "Along a fixed frontier, resources are already fully used, so changing the mix creates an opportunity cost.", "fig": null}, {"n": 225, "lec": 8, "q": "A linear PPF has intercepts of 40 X and 80 Y. What is the opportunity cost of one X?", "ch": ["80 Y.", "2 Y.", "0.5 Y.", "40 Y."], "a": 1, "ex": "Producing all 40 X instead of 80 Y sacrifices 80 / 40 = 2 Y per X.", "fig": null}, {"n": 226, "lec": 8, "q": "A PPF becomes bowed outward because resources differ in suitability for producing the two goods. Moving toward more X commonly causes:", "ch": ["Total available resources to rise automatically.", "The opportunity cost of additional X to become zero.", "The opportunity cost of additional X to rise.", "The opportunity cost of every X to stay constant necessarily."], "a": 2, "ex": "Increasingly less suitable resources must switch into X, so progressively more Y is sacrificed for each extra X.", "fig": null}, {"n": 227, "lec": 8, "q": "Technology improves only in production of X. With unchanged resources and technology for Y, the PPF typically:", "ch": ["Expands toward the X axis while its maximum Y intercept stays unchanged.", "Shifts inward on both axes.", "Keeps both intercepts unchanged necessarily.", "Expands only toward the Y axis."], "a": 0, "ex": "The economy can make more X with given resources, but its all-Y production capability has not changed.", "fig": null}, {"n": 228, "lec": 8, "q": "An economy doubles both intercepts of its linear PPF. What happens to the opportunity cost ratio?", "ch": ["It becomes zero.", "It stays unchanged.", "It doubles.", "It halves."], "a": 1, "ex": "Both numerator and denominator double, so their ratio remains the same. Absolute capacity rises without changing the relative trade-off.", "fig": null}, {"n": 229, "lec": 8, "q": "A country is large and can produce every good domestically. Can it still gain from specialization and trade?", "ch": ["No, because only countries unable to produce a good can trade beneficially.", "No, because absolute size determines every opportunity cost.", "Yes, but only if it has absolute advantage in every good.", "Yes, if its opportunity costs differ from those of trading partners."], "a": 3, "ex": "Gains can arise from differences in relative costs, even when all parties can produce every good.", "fig": null}, {"n": 230, "lec": 8, "q": "Which activity should a producer generally specialize in to exploit comparative advantage?", "ch": ["The activity in which its opportunity cost is relatively lower.", "Every activity in which anyone else is more productive.", "The activity with the highest opportunity cost.", "Only an activity with zero opportunity cost."], "a": 0, "ex": "Specialization according to lower relative costs saves resources and expands possible combined output.", "fig": null}, {"n": 231, "lec": 8, "q": "In one hour A can make 10 X or 5 Y, and B can make 6 X or 6 Y. If each spends half an hour on each good, total output is:", "ch": ["5 X and 3 Y.", "10 X and 6 Y.", "8 X and 5.5 Y.", "16 X and 11 Y."], "a": 2, "ex": "A makes 5 X and 2.5 Y; B makes 3 X and 3 Y. Add across people to obtain 8 X and 5.5 Y.", "fig": null}, {"n": 232, "lec": 8, "q": "Using the same hourly capacities, A (10 X or 5 Y) makes only X and B (6 X or 6 Y) makes only Y for one hour. Compared with each splitting time equally, the output gain is:", "ch": ["2 X and 0.5 Y.", "A loss of 2 X and 0.5 Y.", "2 X and 2 Y.", "10 X and 6 Y."], "a": 0, "ex": "Specialized output is 10 X and 6 Y, versus 8 X and 5.5 Y before. Both totals rise in this example.", "fig": null}, {"n": 233, "lec": 8, "q": "One producer can make either 100 computers or 25 phones in the same time. Producing 4 additional phones on its linear PPF costs:", "ch": ["400 computers.", "16 computers.", "4 computers.", "25 computers."], "a": 1, "ex": "Each phone costs 100 / 25 = 4 computers, so 4 phones cost 16 computers.", "fig": null}, {"n": 234, "lec": 8, "q": "Why can trade allow a country to consume a combination outside its own production possibilities frontier?", "ch": ["Imports have no opportunity cost because they come from abroad.", "Its domestic production point must always move outside its PPF.", "Trade eliminates all resource constraints on domestic production.", "It can specialize and exchange some output for goods produced at lower opportunity cost elsewhere."], "a": 3, "ex": "Production remains within domestic capabilities. Exchange changes the consumption combinations available from that production.", "fig": null}, {"n": 235, "lec": 8, "q": "According to Figure 8, who has absolute advantage in X?", "ch": ["Both have identical productivity in X.", "Neither can produce X.", "B.", "A."], "a": 3, "ex": "With equal resources, A can produce 60 X and B only 40 X, so A has absolute advantage in X.", "fig": 8}, {"n": 236, "lec": 8, "q": "According to Figure 8, who has absolute advantage in Y?", "ch": ["Neither can produce Y.", "Both have identical productivity in Y.", "B.", "A."], "a": 2, "ex": "B's maximum is 40 Y compared with A's 30 Y using equal resources.", "fig": 8}, {"n": 237, "lec": 8, "q": "Using Figure 8, what is A's opportunity cost of one X?", "ch": ["30 Y.", "1 Y.", "2 Y.", "0.5 Y."], "a": 3, "ex": "A gives up 30 Y to produce 60 X, so the cost of X is 30 / 60 = 0.5 Y.", "fig": 8}, {"n": 238, "lec": 8, "q": "Using Figure 8, who has comparative advantage in Y?", "ch": ["A, because one Y costs A 0.5 X.", "Neither, because both can make some Y.", "B, because one Y costs B 1 X but costs A 2 X.", "A, because A can make more X."], "a": 2, "ex": "A's cost of Y is 60 / 30 = 2 X. B's is 40 / 40 = 1 X, so B has the lower opportunity cost.", "fig": 8}, {"n": 239, "lec": 8, "q": "If each producer in Figure 8 uses all available resources according to comparative advantage, combined output is:", "ch": ["60 X and 40 Y.", "100 X and 70 Y.", "40 X and 30 Y.", "50 X and 35 Y."], "a": 0, "ex": "A uses its resources for X and makes 60; B uses its resources for Y and makes 40. Adding both intercepts would double-count each producer's resources.", "fig": 8}, {"n": 240, "lec": 8, "q": "In Figure 8, each producer initially splits resources equally between X and Y. Switching both to full comparative-advantage specialization increases combined output by:", "ch": ["10 X and 5 Y.", "50 X and 35 Y.", "40 X and 30 Y.", "60 X and 40 Y."], "a": 0, "ex": "Initially A makes 30 X and 15 Y; B makes 20 X and 20 Y, totaling 50 X and 35 Y. Specialization yields 60 X and 40 Y.", "fig": 8}]};

const QS = DATA.qs, BYN = {};
QS.forEach(q => BYN[q.n] = q);
const KEY = 'ec120_mcq_v1';
let mem = {missed: [], stats: {}};
function load(){ try { const s = localStorage.getItem(KEY); if (s) mem = JSON.parse(s); } catch(e) {} mem.missed = mem.missed || []; mem.stats = mem.stats || {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch(e) {} }
load();

let round = [], i = 0, score = 0, answered = false, roundMissed = [];

function refreshMenu(){
  const sel = document.getElementById('pool'), prev = sel.value;
  sel.innerHTML = '';
  const opts = [['missed', `My missed questions (${mem.missed.length})`], ['all', 'All 240']];
  Object.entries(DATA.lectures).forEach(([n, name]) => opts.push(['L' + n, `Lecture ${n}: ${name}`]));
  opts.forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o); });
  sel.value = prev && [...sel.options].some(o => o.value === prev) ? prev : (mem.missed.length ? 'missed' : 'all');
  document.getElementById('missedCount').textContent = mem.missed.length;
}
function shuffle(a){ for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }
function show(id){ ['menu','quiz','done'].forEach(x => document.getElementById(x).style.display = x === id ? '' : 'none'); }

function start(list){
  if (!list) {
    const p = document.getElementById('pool').value;
    list = p === 'missed' ? mem.missed.map(n => BYN[n]) : p === 'all' ? QS.slice() : QS.filter(q => 'L' + q.lec === p);
    list = shuffle(list);
    const size = +document.getElementById('size').value;
    if (size) list = list.slice(0, size);
  }
  if (!list.length) { alert('Nothing in that pool yet.'); return; }
  round = list; i = 0; score = 0; roundMissed = [];
  show('quiz'); render();
}
function render(){
  const q = round[i]; answered = false;
  document.getElementById('bar').textContent = `Q ${i + 1}/${round.length} · score ${score}/${i} · #${q.n} (Lecture ${q.lec}: ${DATA.lectures[q.lec]}) · missed list: ${mem.missed.length}`;
  document.getElementById('fig').innerHTML = q.fig ? `<img src="${FIGS[q.fig]}" alt="Figure ${q.fig}">` : '';
  document.getElementById('q').textContent = q.q;
  const box = document.getElementById('chs'); box.innerHTML = '';
  q.ch.forEach((c, k) => {
    const b = document.createElement('button'); b.className = 'ch';
    b.textContent = 'ABCD'[k] + '. ' + c; b.onclick = () => answer(k); box.appendChild(b);
  });
  document.getElementById('ex').style.display = 'none';
  document.getElementById('next').style.display = 'none';
  window.scrollTo(0, 0);
}
function answer(k){
  if (answered) return; answered = true;
  const q = round[i], ok = k === q.a, btns = document.querySelectorAll('.ch');
  btns[q.a].classList.add('right'); if (!ok) btns[k].classList.add('wrong');
  const st = mem.stats[q.n] || [0, 0]; st[ok ? 0 : 1]++; mem.stats[q.n] = st;
  if (ok) { score++; mem.missed = mem.missed.filter(n => n !== q.n); }
  else { roundMissed.push(q); if (!mem.missed.includes(q.n)) mem.missed.push(q.n); }
  save();
  const ex = document.getElementById('ex');
  ex.innerHTML = `<b>${ok ? 'Correct' : 'Wrong'}</b>, answer is ${'ABCD'[q.a]}. ` + q.ex.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) +
    `<div class="small">This question: ${st[0]} right / ${st[1]} wrong all-time</div>`;
  ex.style.display = 'block';
  document.getElementById('next').style.display = '';
  document.getElementById('bar').textContent = document.getElementById('bar').textContent.replace(/score \d+\/\d+/, `score ${score}/${i + 1}`).replace(/missed list: \d+/, `missed list: ${mem.missed.length}`);
}
function next(){
  if (!answered) return;
  i++;
  if (i < round.length) { render(); return; }
  const d = document.getElementById('done');
  d.innerHTML = `<h3>Done: ${score}/${round.length} (${Math.round(100 * score / round.length)}%)</h3>
    <p>Wrong this round: ${roundMissed.length} · total on missed list: ${mem.missed.length}</p>
    ${roundMissed.length ? '<button id="redo">Redo the ones I got wrong this round</button> ' : ''}
    <button onclick="quit()">Back to menu</button>`;
  if (roundMissed.length) document.getElementById('redo').onclick = () => start(shuffle(roundMissed.slice()));
  show('done');
}
function quit(){ refreshMenu(); show('menu'); }
function resetMissed(){ if (confirm('Clear your missed list?')) { mem.missed = []; save(); refreshMenu(); } }
document.addEventListener('keydown', e => {
  if (document.getElementById('quiz').style.display === 'none') return;
  const k = e.key.toLowerCase(), idx = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
  if (idx >= 0 && k.length === 1) answer(idx);
  else if (k === 'enter' || k === 'n' || k === ' ') { e.preventDefault(); next(); }
});
refreshMenu();
</script>
